# Feature pipeline configuration.
# All values are assumptions for CN/SMEs to confirm; see docs/assumptions.md.
# Feature code must read these via src/rpc/features/spec.py, never hard-code them.

features:
  # Recency windows in days. Dev/full sim horizon is ~180 days; keep windows
  # short so recent windows are populated. Longer windows would be
  # indistinguishable from the max window on short histories.
  windows_days: [1, 3, 7, 14, 30]

  # Timezone used for slot/weekday/calendar features.
  timezone: "Asia/Kolkata"

  # Time-of-day slots: [start_hour_inclusive, end_hour_exclusive) in local time.
  slots:
    morning: [8, 12]
    afternoon: [12, 16]
    evening: [16, 19]

  # Ring-duration thresholds (seconds).
  short_ring_seconds: 3.0

  # Network responses counted as failure for fail-share / streak features.
  # "answered" is the only success; everything else is a failure.
  failure_responses:
    - "no_answer"
    - "busy"
    - "switched_off"
    - "not_reachable"
    - "does_not_exist"
    - "immediate_hangup"

  # Response values expanded as n_<response>_W count features.
  response_values:
    - "switched_off"
    - "not_reachable"
    - "does_not_exist"
    - "no_answer"
    - "busy"

  # Disposition values expanded as n_<disposition> count features.
  # Must match the canonical values the ingest mappings emit; values absent
  # from mapped data yield permanently-zero columns, so keep this list tight.
  disposition_values:
    - "rpc"
    - "wrong_number"
    - "third_party"
    - "dispute"
    - "promise_to_pay"
    - "callback"
    - "switched_off"
    - "not_reachable"

  # Disposition values that count as borrow-contact (RPC evidence) for
  # recency/confirmation/label features. rpc_* variants map into these
  # canonical values at ingest; the list lives here (not hardcoded) so a
  # sanctioned-set change is config-only.
  rpc_dispositions:
    - "RPC"
    - "promise_to_pay"
    - "callback"
    - "dispute"

  # A payment confirms a contact point if it occurs within this many days
  # AFTER an answered call or RPC disposition on that contact point.
  payment_confirmation_days: 7

  # who_answered values from voice-bot transcripts.
  bot_who_values:
    - "borrower"
    - "other"
    - "unknown"

  # Field-visit outcomes expanded as visit count features.
  # Must match the canonical outcomes the ingest mappings emit.
  visit_outcomes:
    - "locked_premises"
    - "nobody_of_that_name"
    - "met_borrower"
    - "met_third_party"
    - "address_not_found"

  # Account-context passthroughs: feature name, candidate source columns
  # (first present column wins), output dtype. The borrowers table carries
  # canonical names; the official accounts.csv carries the fallbacks
  # (borrower grain IS account grain: no borrower_id exists, Q1).
  # Quarantined (snapshot as-of unconfirmed or behaviour-history with
  # unknown provenance — excluded, not emitted): salary_credit_day,
  # ability_to_pay_estimate, prev_ptp_count, prev_ptp_broken.
  # secured_flag dropped: no secured column exists and the
  # portfolio->secured mapping is unknown (do not invent it).
  account_passthroughs:
    - {feature: dpd_bucket, columns: [dpd_bucket, bucket_start], dtype: string}
    - {feature: outstanding, columns: [outstanding], dtype: Float64}
    - {feature: product, columns: [product, portfolio], dtype: string}
    - {feature: bureau_score_band, columns: [bureau_score_band], dtype: string}
    - {feature: income_type, columns: [income_type], dtype: string}
    - {feature: preferred_language, columns: [preferred_language], dtype: string}
    - {feature: town_id, columns: [town_id], dtype: string}
    - {feature: dpd_start, columns: [dpd_start], dtype: Int64}
    - {feature: overdue_start, columns: [overdue_start], dtype: Float64}
    - {feature: emi_amount, columns: [emi_amount], dtype: Float64}
    - {feature: other_active_loans, columns: [other_active_loans], dtype: Int64}
    - {feature: paid_other_lenders_30d, columns: [paid_other_lenders_30d], dtype: boolean}
    - {feature: last_bounce_reason, columns: [last_bounce_reason], dtype: string}

  # Calendar holidays (YYYY-MM-DD, illustrative list).
  holidays:
    - "2026-08-15"
    - "2026-10-02"
    - "2026-11-08"

quarantine:
  # Account snapshot fields quarantined until their as-of date is confirmed
  # (see docs/dataset_audit.md §6). These fields have no timestamp column and
  # are assumed start-of-window but unconfirmed. The pipeline must run with
  # and without them.
  account_fields:
    - dpd_bucket
    - outstanding
    - emi_amount
    - overdue_start
    - paid_other_lenders_30d
    - last_bounce_reason
  # When false (default), quarantined fields are excluded from feature output.
  # Pass --with-quarantined to the feature builder to include them.
  as_of_confirmed: false

labels:
  # Observed-label window: RPC disposition with occurred_at in (as_of, as_of + N days].
  rpc_next_days: 7

# Columns that must never appear in feature output. If any are found in
# source tables they are dropped before use and reported.
banned_columns:
  - "ground_truth"
  - "true_state"
  - "true_avoidance"
  - "true_borrower_avoidance"
  - "shared_reason"
  - "policy_action"
