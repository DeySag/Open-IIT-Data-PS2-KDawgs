# Field mapping: simulator's own output (events.parquet) -> canonical envelope.
# SIMULATION-ONLY: loads Parquet written by src/rpc/sim/generate.py. Columns are
# already canonical; contact_point_ref is already a hash (hash_passthrough) and
# payload is a per-row JSON string parsed into the payload dict.

source: simulator
description: "SIMULATION-ONLY loader for the repo simulator's events.parquet output"
format: parquet

contact_point:
  raw_field: contact_point_ref
  kind: hash_passthrough

fields:
  event_id: {field: event_id}
  event_type: {field: event_type}
  lender_id: {field: lender_id}
  borrower_id: {field: borrower_id}
  account_id: {field: account_id}
  occurred_at: {field: occurred_at, format: iso}
  received_at: {field: received_at, format: iso}

# Payload arrives as a JSON string column; parsed per row into the payload dict.
payload_json_field: payload

validation:
  clock_skew_tolerance_seconds: 300
  sample_rate: 0.01
  sample_seed: 42
