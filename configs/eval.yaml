# Evaluation harness configuration.
# All values are assumptions; tune here, never in code.
# Dev horizon is 30 days -> keep windows small and configurable.

splits:
  step_days: 7          # spacing between successive as_of origins
  n_splits: 3           # number of rolling origins
  train_days: 14        # lookback window ending at as_of used for training
  embargo_days: 3       # gap between train max and test start (no scoring inside gap)
  test_days: 7          # scoring window after embargo
  seed: 42

labels:
  horizon_days: 7       # rpc_next_7d window after as_of
  rpc_network_responses: ["answered"]   # dial_attempt responses counted as observed contact (proxy for RPC; confirm code set against issued extracts)
  rpc_dispositions: ["RPC", "promise_to_pay", "callback"]  # disposition values counted as observed RPC

# Incumbent attempt-count rule (assumed values pending confirmation against
# the issued extracts; see docs/dataset_audit.md §6 for the reconstructable
# propensities).
incumbent:
  k_consecutive_failures: 3   # move off primary after k consecutive failures
  max_attempts_trace: 6       # trigger trace after this many total attempts
  primary_first: true         # rank primary contact point first
  base_score: 0.5

baselines:
  account_gbm:
    n_estimators: 100
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    seed: 42
  contact_gbm:
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    seed: 42

metrics:
  n_bootstrap: 200
  ci_level: 0.95
  seed: 42
  reliability_bins: 10
  recycled_cost_ratio: 100   # missed-recycled cost / false-suppression cost (from guardrails.yaml)
  recycled_thresholds: [0.1, 0.3, 0.5, 0.7, 0.9]
  detection_k: [1, 3, 6]     # "dead points detected within k attempts"
  rpc_top_n: 1000            # RPC per 1,000 dials

propensity:
  enabled: true
  min_prob: 0.05             # clip propensities to [min_prob, 1-min_prob]
  max_prob: 0.95

report:
  label: "RPC evaluation"
  out_dir: "reports"

data:
  events: "data/events.parquet"
  contact_points: "data/contact_points.parquet"
  borrowers: "data/borrowers.parquet"
  policy_log: "data/policy_log.parquet"       # eval-only; models must never read
