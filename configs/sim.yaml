# Simulator Configuration
# All parameters are assumptions for CN/SMEs to confirm
# See docs/assumptions.md for tracking

simulator:
  # Scale
  n_borrowers_full: 100000
  n_borrowers_dev: 5000
  n_contact_points_per_borrower_mean: 2.5
  n_events_per_contact_point_mean: 20

  # Borrower population
  product_mix:
    secured_retail: 0.25
    unsecured_retail: 0.40
    msme: 0.20
    microfinance: 0.15

  dpd_bucket_distribution:
    X: 0.10
    "1-30": 0.25
    "31-60": 0.20
    "61-90": 0.20
    "90+": 0.25

  # Contact point states (true state, hidden from models)
  phone_state_transitions:
    valid_reachable:
      to_valid_reachable: 0.85
      to_avoiding: 0.05
      to_temp_unreachable: 0.05
      to_switched_off_long: 0.03
      to_recycled: 0.01
      to_third_party: 0.01
      to_invalid: 0.00
    avoiding:
      to_valid_reachable: 0.10
      to_avoiding: 0.70
      to_temp_unreachable: 0.10
      to_switched_off_long: 0.05
      to_recycled: 0.02
      to_third_party: 0.02
      to_invalid: 0.01
    temp_unreachable:
      to_valid_reachable: 0.60
      to_avoiding: 0.05
      to_temp_unreachable: 0.20
      to_switched_off_long: 0.10
      to_recycled: 0.02
      to_third_party: 0.02
      to_invalid: 0.01
    switched_off_long:
      to_valid_reachable: 0.10
      to_avoiding: 0.05
      to_temp_unreachable: 0.10
      to_switched_off_long: 0.50
      to_recycled: 0.15
      to_third_party: 0.05
      to_invalid: 0.05
    recycled:
      to_recycled: 0.95
      to_invalid: 0.05
    third_party:
      to_third_party: 0.80
      to_valid_reachable: 0.10
      to_invalid: 0.10
    invalid:
      to_invalid: 1.00

  # Initial state distribution
  initial_state_dist:
    valid_reachable: 0.50
    avoiding: 0.15
    temp_unreachable: 0.10
    switched_off_long: 0.10
    recycled: 0.05
    third_party: 0.05
    invalid: 0.05

  # Emission probabilities (what we observe given true state)
  emissions:
    valid_reachable:
      answered: 0.35
      no_answer: 0.45
      busy: 0.05
      switched_off: 0.05
      not_reachable: 0.05
      does_not_exist: 0.00
      immediate_hangup: 0.05
    avoiding:
      answered: 0.02
      no_answer: 0.60
      busy: 0.05
      switched_off: 0.15
      not_reachable: 0.10
      does_not_exist: 0.00
      immediate_hangup: 0.08
    temp_unreachable:
      answered: 0.10
      no_answer: 0.30
      busy: 0.10
      switched_off: 0.25
      not_reachable: 0.20
      does_not_exist: 0.00
      immediate_hangup: 0.05
    switched_off_long:
      answered: 0.01
      no_answer: 0.10
      busy: 0.02
      switched_off: 0.60
      not_reachable: 0.20
      does_not_exist: 0.02
      immediate_hangup: 0.05
    recycled:
      answered: 0.05
      no_answer: 0.20
      busy: 0.05
      switched_off: 0.10
      not_reachable: 0.15
      does_not_exist: 0.40
      immediate_hangup: 0.05
    third_party:
      answered: 0.40
      no_answer: 0.30
      busy: 0.05
      switched_off: 0.10
      not_reachable: 0.10
      does_not_exist: 0.00
      immediate_hangup: 0.05
    invalid:
      answered: 0.00
      no_answer: 0.10
      busy: 0.02
      switched_off: 0.05
      not_reachable: 0.10
      does_not_exist: 0.70
      immediate_hangup: 0.03

  # Ring duration by state (seconds, log-normal params)
  ring_duration:
    answered: { mean: 2.5, std: 0.8 }
    no_answer: { mean: 30.0, std: 0.5 }
    busy: { mean: 1.0, std: 0.3 }
    switched_off: { mean: 0.5, std: 0.2 }
    not_reachable: { mean: 1.0, std: 0.3 }
    does_not_exist: { mean: 0.2, std: 0.1 }
    immediate_hangup: { mean: 1.5, std: 0.5 }

  # Disposition probabilities by true state
  dispositions:
    valid_reachable:
      RPC: 0.70
      wrong_number: 0.02
      third_party: 0.05
      switched_off: 0.05
      not_reachable: 0.05
      promise_to_pay: 0.10
      dispute: 0.03
      callback: 0.05
    avoiding:
      RPC: 0.05
      wrong_number: 0.03
      third_party: 0.10
      switched_off: 0.30
      not_reachable: 0.25
      promise_to_pay: 0.02
      dispute: 0.05
      callback: 0.20
    temp_unreachable:
      RPC: 0.20
      wrong_number: 0.02
      third_party: 0.05
      switched_off: 0.25
      not_reachable: 0.20
      promise_to_pay: 0.05
      dispute: 0.03
      callback: 0.20
    switched_off_long:
      RPC: 0.02
      wrong_number: 0.02
      third_party: 0.05
      switched_off: 0.50
      not_reachable: 0.25
      promise_to_pay: 0.01
      dispute: 0.02
      callback: 0.13
    recycled:
      RPC: 0.01
      wrong_number: 0.60
      third_party: 0.10
      switched_off: 0.05
      not_reachable: 0.10
      promise_to_pay: 0.00
      dispute: 0.02
      callback: 0.12
    third_party:
      RPC: 0.10
      wrong_number: 0.05
      third_party: 0.60
      switched_off: 0.05
      not_reachable: 0.05
      promise_to_pay: 0.02
      dispute: 0.03
      callback: 0.10
    invalid:
      RPC: 0.00
      wrong_number: 0.40
      third_party: 0.05
      switched_off: 0.05
      not_reachable: 0.15
      promise_to_pay: 0.00
      dispute: 0.00
      callback: 0.35

  # Borrower-level avoidance propensity (shared across contact points)
  avoidance_propensity:
    base_rate: 0.20
    by_dpd_bucket:
      X: 0.05
      "1-30": 0.10
      "31-60": 0.20
      "61-90": 0.30
      "90+": 0.40

  # Contact point source
  source_dist:
    KYC: 0.40
    later_update: 0.25
    bureau: 0.15
    borrower_on_call: 0.10
    skip_trace: 0.10

  # Costs (INR)
  costs:
    sms_whatsapp: 0.10
    voice_bot: 2.0
    telecaller: 20.0
    field_visit: 250.0
    skip_trace: 500.0

  # Trace
  trace:
    success_rate: 0.30
    cost_per_trace: 500.0

  # Recovery
  recovery:
    p_recovery_if_reached: 0.25
    p_recovery_if_not_reached: 0.02
    recoverable_amount_multiplier: 0.70  # vs outstanding

  # Time
  simulation_days: 180
  event_frequency_per_day: 50000

  # Random seed
  seed: 42