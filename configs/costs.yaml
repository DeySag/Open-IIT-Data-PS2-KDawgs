# Cost Configuration (INR)
# All costs are assumptions for CN/SMEs to confirm

costs:
  # Channel costs per attempt/connect
  channels:
    sms:
      cost_per_attempt: 0.05
      cost_per_delivered: 0.10
    whatsapp:
      cost_per_attempt: 0.10
      cost_per_delivered: 0.20
      cost_per_read: 0.50
    voice_bot:
      cost_per_call: 2.0
      cost_per_connect: 3.0
      cost_per_minute: 1.0
    telecaller:
      cost_per_attempt: 10.0
      cost_per_connect: 25.0
      cost_per_minute: 5.0
    field_visit:
      cost_per_visit: 250.0
      cost_per_productive_visit: 400.0

  # Skip trace costs
  skip_trace:
    digital:
      cost_per_trace: 100.0
      success_rate: 0.25
    physical:
      cost_per_trace: 500.0
      success_rate: 0.40
    bureau:
      cost_per_trace: 50.0
      success_rate: 0.15

  # Collection costs (post-contact)
  collection:
    telecaller_per_minute: 5.0
    field_per_visit: 300.0
    legal_notice: 2000.0
    legal_proceedings: 50000.0

  # Compliance and goodwill costs (estimated)
  compliance:
    recycled_disclosure_penalty: 100000.0  # per incident
    third_party_disclosure_penalty: 50000.0
    dnd_violation_penalty: 10000.0
    contact_hours_violation: 5000.0
    customer_goodwill_loss_per_incident: 1000.0

  # Recoverable amount calculation
  recoverable:
    # Multipliers by bucket (applied to outstanding)
    dpd_multipliers:
      X: 1.0
      "1-30": 0.95
      "31-60": 0.85
      "61-90": 0.70
      "90+": 0.50
    # Secured vs unsecured
    secured_multiplier: 1.0
    unsecured_multiplier: 0.60
    # Discount rate (annual)
    discount_rate: 0.12
    # Penal charge restrictions (RBI)
    max_penal_charge_rate: 0.24  # annualised

  # VOI calculation
  voi:
    # Portfolio trace budget (daily)
    daily_trace_budget: 100000.0
    # Minimum VOI per rupee to queue
    min_voi_per_rupee: 0.5
    # Exploration budget fraction
    exploration_fraction: 0.05