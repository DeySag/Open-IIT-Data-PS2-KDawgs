[project]
name = "ps2-rpc"
version = "0.1.0"
description = "Right-Party Contact Prediction and Skip-Trace Prioritisation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "polars>=1.0",
    "pyarrow>=14.0",
    "duckdb>=1.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.3",
    "pydantic>=2.5",
    "fastapi>=0.108",
    "uvicorn>=0.25",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C90", "PL", "RUF", "T20", "PTH", "ERA", "PD", "PGH", "SIM", "TID", "TRY"]
ignore = ["S101", "S113", "S311", "S603"]
per-file-ignores = {"tests/*" = ["S101", "S113", "S311"]}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"